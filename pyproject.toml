[project]
name = "wheeled-legged-mjlab"
version = "0.1.0"
description = "mjlab environment for wheeled-legged robot."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mjlab==1.6.0",
    "rsl-rl-lib",
]

[tool.uv]
override-dependencies = [
    "rsl-rl-lib==5.3.0",
    "warp-lang==1.14.0",
]

[tool.uv.sources]
rsl-rl-lib = {path="rsl_rl", editable = true}

[project.entry-points."mjlab.tasks"]
wheeled_legged_mjlab = "wheeled_legged_mjlab"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.0",
]
